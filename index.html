<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本語単語カード｜全10語</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#19283c;background:#edf3fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#193d69,#3275a9);color:white;padding:26px 16px}header>div,main{max-width:850px;margin:auto}h1{margin:0 0 7px;font-size:1.6rem}header p{margin:0;line-height:1.7}main{padding:18px 13px 70px}.toolbar,.actions,.nav,.tabs{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}button,input,select{font:inherit;border:1px solid #c5d5e6;border-radius:11px;background:white;padding:10px 13px;color:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button.active,.primary{background:#2467a3;color:white;border-color:#2467a3}input[type=search]{flex:1;min-width:160px}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}.panel{background:white;border:1px solid #dce5ef;border-radius:20px;padding:22px;box-shadow:0 6px 24px #173a6510}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.heading h2{font-size:1.7rem;margin:4px 0}.muted{color:#526c87;font-size:.9rem}.tabs button{flex:1;min-width:64px}.section{font-size:1rem;line-height:1.95;overflow-wrap:anywhere}.section h1{font-size:1.3rem}.section h2{font-size:1.18rem;color:#175e91;margin:22px 0 8px}.section h3{font-size:1.08rem;margin:16px 0 6px}.section p{margin:10px 0}.section ul{padding-left:24px}.section table{display:block;overflow-x:auto;border-collapse:collapse}.section td,.section th{border:1px solid #dae3ec;padding:8px}.section img,.hero{width:100%;height:auto;border-radius:14px;display:block}.hero{max-height:420px;object-fit:contain;background:#f5f8fb;margin:14px 0 20px}.section figure{margin:12px 0}.section .source{white-space:pre-wrap}.quiz{border-top:1px solid #dce6f0;padding-top:16px;margin-top:24px}.quiz fieldset{border:1px solid #dce5ef;border-radius:12px;margin:14px 0;padding:14px}.quiz legend{font-weight:700}.quiz label{display:block;padding:9px;border-radius:8px;cursor:pointer}.quiz label:hover{background:#f2f7fc}.quiz input{margin-right:8px}.feedback{padding:10px;background:#edf5fc;border-radius:8px;margin-top:8px}.nav{justify-content:space-between}.foot{font-size:.85rem;color:#566b80;line-height:1.8;margin-top:20px}.dark{background:#101a2a;color:#eaf0f9}.dark .panel,.dark button,.dark input,.dark select{background:#1e2b3c;color:#eaf0f9;border-color:#45576b}.dark .feedback{background:#2c4259}.dark .section h2{color:#8ec8f7}@media(max-width:520px){.panel{padding:15px}.heading h2{font-size:1.4rem}header{padding:20px 14px}.toolbar{align-items:stretch}.nav button{flex:1}}
</style></head><body><header><div><h1>日本語単語カード｜全10語</h1><p>画像で理解し、A・B・C・Dで深め、3問で記憶を確認する単語帳</p></div></header><main><div class="toolbar"><input type="search" id="search" placeholder="単語・解説を検索"><select id="filter"><option value="all">すべて</option><option value="fav">お気に入り</option><option value="todo">未学習</option><option value="done">学習済み</option><option value="wrong">間違えた問題</option></select><button id="theme">夜間表示</button></div><p class="muted" id="count"></p><article class="panel"><div class="heading"><div><span class="muted" id="number"></span><h2 id="word"></h2></div><button id="favorite">☆ お気に入り</button></div><div class="actions"><label><input type="checkbox" id="learned"> 学習済み</label><button id="reveal">答えを隠す</button></div><img id="hero" class="hero" alt="単語の記憶用イメージ"><div class="tabs" id="tabs"></div><div id="content" class="section"></div><div class="quiz"><h3>理解確認・暗記テスト（3問）</h3><p class="muted">選択すると、その場で正解と解説を確認できます。</p><div id="questions"></div><button id="retry">再挑戦</button></div><div class="nav"><button id="prev">← 前のカード</button><button id="next">次のカード →</button></div></article><p class="foot">既存の日本語単語帳に収録された解説本文・画像を利用しています。画像は同梱されており、GitHub Pages上でも表示できます。お気に入り・学習状況はブラウザ内に保存されます。</p></main><script src="data.js"></script><script>
const $=id=>document.getElementById(id);const labels=['A','B','C','D','全文'];let tab='A',current=0,revealed=true;let state={};try{state=JSON.parse(localStorage.getItem('jp_vocab10_general_style')||'{}')}catch(e){}function save(){try{localStorage.setItem('jp_vocab10_general_style',JSON.stringify(state))}catch(e){}}function st(i){return state[i]||(state[i]={})}function filtered(){const q=$('search').value.toLowerCase(),f=$('filter').value;return VOCAB.map((x,i)=>i).filter(i=>{let x=VOCAB[i],s=st(i);return(x.word+Object.values(x.sections).join(' ')).toLowerCase().includes(q)&&(f==='all'||f==='fav'&&s.fav||f==='todo'&&!s.done||f==='done'&&s.done||f==='wrong'&&s.wrong)})}
function render(){const ids=filtered();if(!ids.includes(current))current=ids[0]??-1;$('count').textContent=`表示 ${ids.length} / 全 ${VOCAB.length} 語`;if(current<0){$('word').textContent='該当する単語がありません';$('content').innerHTML='';$('questions').innerHTML='';$('hero').hidden=true;return}let x=VOCAB[current],s=st(current);$('number').textContent=`${current+1} / ${VOCAB.length}`;$('word').textContent=x.word;$('favorite').textContent=s.fav?'★ お気に入り':'☆ お気に入り';$('learned').checked=!!s.done;$('reveal').textContent=revealed?'答えを隠す':'答えを表示';$('hero').hidden=false;$('hero').src=x.image||`images/${String(x.number).padStart(2,'0')}_${x.word}.png`;$('hero').alt=x.word+' の記憶用イメージ';$('tabs').innerHTML='';labels.forEach(t=>{let b=document.createElement('button');b.textContent=t;b.className=tab===t?'active':'';b.onclick=()=>{tab=t;render()};$('tabs').appendChild(b)});$('content').innerHTML=revealed?(tab==='全文'?['A','B','C','D'].map(k=>x.sections[k]).join(''):x.sections[tab]):'<p>意味と用例を思い出してから「答えを表示」を押してください。</p>';const qs=QUIZZES[current]||[];$('questions').innerHTML=qs.map((q,j)=>`<fieldset><legend>Q${j+1}. ${q[0]}</legend>${q[1].map((opt,k)=>`<label><input type="radio" name="q${current}_${j}" value="${k}"> ${opt}</label>`).join('')}<div class="feedback" hidden></div></fieldset>`).join('');$('questions').querySelectorAll('fieldset').forEach((fs,j)=>fs.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{let q=qs[j],ok=q[1][+inp.value]===q[2],fb=fs.querySelector('.feedback');fb.hidden=false;fb.textContent=(ok?'正解です！':'惜しいです。')+' 正解：'+q[2]+'。'+(ok?'意味を覚えていますね。':'この単語の意味と使い方をもう一度確認しましょう。');if(!ok){s.wrong=true;save()}}));$('prev').disabled=ids.indexOf(current)<=0;$('next').disabled=ids.indexOf(current)>=ids.length-1}
$('search').oninput=render;$('filter').onchange=render;$('favorite').onclick=()=>{st(current).fav=!st(current).fav;save();render()};$('learned').onchange=e=>{st(current).done=e.target.checked;save();render()};$('reveal').onclick=()=>{revealed=!revealed;render()};$('retry').onclick=()=>{st(current).wrong=false;save();render()};$('prev').onclick=()=>{let ids=filtered();current=ids[ids.indexOf(current)-1];render()};$('next').onclick=()=>{let ids=filtered();current=ids[ids.indexOf(current)+1];render()};$('theme').onclick=()=>document.body.classList.toggle('dark');render();
</script></body></html>
